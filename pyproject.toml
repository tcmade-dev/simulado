[project]
name = "simulado"
version = "0.1.0"
description = "Simulado - Introdução ao Santo Ministério (IBADEP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
pdf = [
    "pdf2docx>=0.5.13",
    "pymupdf>=1.26.7",
    "python-docx>=1.2.0",
]

[tool.vercel]
entrypoint = "main:app"
